{% include "django/forms/widgets/textarea.html" %}
<div class="richtext-wrap" data-target="{{ widget.attrs.id }}">

    <div class="richtext-toolbar">
        <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
        <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
        <span class="richtext-divider"></span>
        <button type="button" data-cmd="formatBlock" data-value="H2" title="Heading">H2</button>
        <button type="button" data-cmd="formatBlock" data-value="H3" title="Subheading">H3</button>
        <button type="button" data-cmd="formatBlock" data-value="P" title="Paragraph">¶</button>
        <span class="richtext-divider"></span>
        <button type="button" data-cmd="insertUnorderedList" title="Bullet list">&bull; List</button>
        <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
        <span class="richtext-divider"></span>
        <button type="button" data-action="link" title="Insert link">🔗 Link</button>
        <button type="button" data-action="image" title="Insert image">🖼 Image</button>
        <button type="button" data-action="table" title="Insert table">▦ Table</button>
        <button type="button" data-action="card" title="Insert card block">▢ Card</button>
        <span class="richtext-divider"></span>
        <button type="button" data-action="preview" title="Toggle preview">👁 Preview</button>
    </div>

    <div
        class="richtext-surface"
        id="{{ widget.richtext_id }}"
        contenteditable="true"></div>

    <input type="file" class="richtext-image-input" accept="image/*" hidden>

</div>
