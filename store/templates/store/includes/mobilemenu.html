{% load static %}

<!-- ==========================================
MOBILE NAVIGATION DRAWER (canonical reference
implementation — every other drawer/accordion
on the site should match this architecture)
========================================== -->

<div id="mobileOverlay" class="mobile-overlay"></div>

<div id="mobileMenu" class="mobile-menu" role="dialog" aria-modal="true" aria-label="Site menu">

    <div class="mobile-menu-header">
        <button
            type="button"
            id="closeMenu"
            class="close-menu"
            aria-label="Close menu">
            &times;
        </button>
    </div>

    <nav class="mobile-menu-links">

        {% for category in categories %}

        <button
            type="button"
            class="mobile-category-btn"
            aria-expanded="false">
            {{ category.name }}
            <span class="mobile-arrow">›</span>
        </button>

        <div class="mobile-subcategories">

            <a href="{% url 'category_products' category.slug %}">
                All {{ category.name }}
            </a>

            {% for sub in category.subcategories.all %}
            <a href="{% url 'subcategory_products' category.slug sub.slug %}">
                {{ sub.name }}
            </a>
            {% endfor %}

        </div>

        {% endfor %}

    </nav>

    <div class="mobile-social">
        {% if site_settings.instagram %}
        <a href="{{ site_settings.instagram }}" target="_blank" rel="noopener noreferrer">
            <img src="{% static 'store/icons/instagram.svg' %}" alt="Instagram">
        </a>
        {% endif %}

        {% if site_settings.facebook %}
        <a href="{{ site_settings.facebook }}" target="_blank" rel="noopener noreferrer">
            <img src="{% static 'store/icons/facebook.svg' %}" alt="Facebook">
        </a>
        {% endif %}

        {% if site_settings.pinterest %}
        <a href="{{ site_settings.pinterest }}" target="_blank" rel="noopener noreferrer">
            <img src="{% static 'store/icons/pinterest.svg' %}" alt="Pinterest">
        </a>
        {% endif %}
    </div>

</div>
